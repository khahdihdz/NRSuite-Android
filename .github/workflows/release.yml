name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Configure shared release signing
        env:
          KS: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          SP: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$KS" || { echo "::error::Shared Android signing keystore is not configured."; exit 1; }
          test -n "$SP" || { echo "::error::Shared Android signing store password is not configured."; exit 1; }
          test -n "$ALIAS" || { echo "::error::Shared Android signing alias is not configured."; exit 1; }
          test -n "$KP" || { echo "::error::Shared Android signing key password is not configured."; exit 1; }
          printf '%s' "$KS" | base64 --decode > release.jks
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$GITHUB_WORKSPACE/release.jks" "$SP" "$ALIAS" "$KP" > keystore.properties
          chmod 600 release.jks keystore.properties
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build release APK and AAB
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace
      - name: Prepare release assets
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/NRSuite-Android-${VERSION}-release.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/NRSuite-Android-${VERSION}-release.aab"
          cd dist
          sha256sum NRSuite-Android-*.apk NRSuite-Android-*.aab > checksums.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NRSuite-Android-*-release.apk
            dist/NRSuite-Android-*-release.aab
            dist/checksums.txt
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
