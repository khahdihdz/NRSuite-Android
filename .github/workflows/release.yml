name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  # Tag tao qua giao dien tao release tren web khong phai luc nao cung
  # phat su kien push (lan tao lai tag v1.0.0-vi.1 tren commit 745bfa1
  # da khong kich hoat workflow), nen them trigger release de viec
  # xuat ban release luon chay workflow nay. workflow_dispatch de
  # chay tay khi can chay lai.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Classify release channel
        id: release_channel
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          case "$TAG" in
            *-alpha*) CHANNEL=alpha; PRERELEASE=true ;;
            *-beta*)  CHANNEL=beta;  PRERELEASE=true ;;
            *-rc*)    CHANNEL=rc;    PRERELEASE=true ;;
            *)        CHANNEL=stable; PRERELEASE=false ;;
          esac
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "ERROR: unsupported release tag: $TAG" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Release version=$VERSION channel=$CHANNEL prerelease=$PRERELEASE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Decode keystore
        # Keystore chung cua khahdihdz, quan ly boi repo khahdihdz/apksign
        # (alias khahdihdz-release, RSA-4096). Secrets duoc dong bo tu apksign
        # bang workflow "Sync Android signing to all repositories".
        # Giong buoc validate cua apksign: cat khoang trang va bu padding
        # Base64 truoc khi decode. base64 --decode se cat ngan file keystore
        # neu thieu padding "=" ma khong bao loi (khong co pipefail), khien
        # Gradle khong doc duoc khoa ky ("Given final block not properly padded").
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          B64="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          remainder=$(( ${#B64} % 4 ))
          if [ "$remainder" -eq 1 ]; then
            echo "ERROR: ANDROID_SIGNING_KEYSTORE_BASE64 has an invalid Base64 length." >&2
            exit 1
          elif [ "$remainder" -eq 2 ]; then
            B64="$B64=="
          elif [ "$remainder" -eq 3 ]; then
            B64="$B64="
          fi
          printf '%s' "$B64" | base64 --decode > release.jks
          test -s release.jks

      - name: Create release signing config
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -eu
          printf 'storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$GITHUB_WORKSPACE/release.jks" "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" \
            > keystore.properties

      - name: Validate decoded keystore
        # Chan doan: kiem tra ngay trong job release xem keystore giai ma
        # co mo duoc khong, dung chinh cac secret ANDROID_SIGNING_* da dong
        # bo. Giong buoc validate cua apksign: chi in kich thuoc, hash va
        # ten alias, khong in gia tri secret.
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          pwd
          ls -l release.jks
          sha256sum release.jks
          keytool -list -keystore release.jks -storepass "$STORE_PASSWORD" -alias "${KEY_ALIAS:-khahdihdz-release}"
          keytool -importkeystore \
            -srckeystore release.jks -srcstorepass "$STORE_PASSWORD" \
            -srcalias "${KEY_ALIAS:-khahdihdz-release}" -srckeypass "$KEY_PASSWORD" \
            -destkeystore /tmp/key-password-check.p12 -deststoretype PKCS12 \
            -deststorepass "$STORE_PASSWORD" \
            -destalias "${KEY_ALIAS:-khahdihdz-release}" -destkeypass "$KEY_PASSWORD" \
            -noprompt
          rm -f /tmp/key-password-check.p12
          echo "Decoded keystore and all signing secrets validated."

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Validate app version against release tag
        env:
          RELEASE_VERSION: ${{ steps.release_channel.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release_channel.outputs.channel }}
        run: |
          set -eu
          TAG="$RELEASE_VERSION"
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts | head -1)
          echo "Tag: $TAG"
          echo "Channel: $RELEASE_CHANNEL"
          echo "App versionName: $VERSION_NAME"
          echo "App versionCode: $VERSION_CODE"
          if [ "$VERSION_NAME" != "$TAG" ]; then
            echo "ERROR: release tag and Android versionName do not match." >&2
            exit 1
          fi
          if [ -z "$VERSION_CODE" ] || [ "$VERSION_CODE" -le 0 ]; then
            echo "ERROR: invalid Android versionCode." >&2
            exit 1
          fi

      - name: Test, lint, and build release APK
        run: ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signature
        run: |
          set -eu
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found in Android SDK build-tools." >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        env:
          RELEASE_VERSION: ${{ steps.release_channel.outputs.version }}
          RELEASE_CHANNEL: ${{ steps.release_channel.outputs.channel }}
        run: |
          set -eu
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/NRSuite-Android-${RELEASE_VERSION}-${RELEASE_CHANNEL}.apk"
          cd dist
          sha256sum NRSuite-Android-*.apk > checksums.txt
          cat checksums.txt

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NRSuite-Android-*.apk
            dist/checksums.txt
          prerelease: ${{ steps.release_channel.outputs.prerelease == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
